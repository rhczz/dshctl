name: CI

# What runs, and why it has this shape.
#
#   * test (three platforms): the compile gate and the strict test run, once per
#     platform. `go vet ./...` is the compile gate — it type-checks every package
#     *and* its test files, which `go build ./...` does not — and the build job
#     links the real binaries with the release flags, so a separate compile step
#     was a subset of work already done here and there.
#   * hermetic: three properties of the same suite execution. The tests leave no
#     state outside their own temporary directories, no test skips silently, and
#     the Node resolution stays covered statement by statement. All three read
#     one run; running the suite once per property tripled the job without
#     asserting anything more.
#   * build (six targets): only from a commit whose tests and hermetic checks
#     passed. That is the whole point of putting both in one pipeline.
#   * vulncheck: the toolchain's own advisories, with the tool pinned so an
#     unchanged commit cannot turn red because a scanner was released.
#
# Trigger policy: every commit that lands on main is verified, and every pull
# request aimed at main is verified before it can be merged. A branch nobody has
# proposed against main runs nothing, which keeps the pipeline focused on the
# history that is meant to stay green.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Superseded runs of one pull request are cancelled — only its newest commit is
# worth verifying. Runs on main are never cancelled, so every commit that lands
# keeps a complete record of what was checked.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Keep the toolchain honest about what it is building. CGO is deliberately
  # *not* disabled here: the race detector needs cgo, and a global CGO_ENABLED=0
  # made `go test -race` fail on every platform before it compiled a single
  # package. The one job that needs cgo off — the cross-compile job — sets it on
  # its own step.
  GOFLAGS: -trimpath

jobs:
  test:
    name: test (${{ matrix.os }})
    # A hung wait loop would otherwise hold a runner until the six-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every trigger compiles and tests on all three platforms, and one
        # platform failing never cancels the others (fail-fast: false). The port
        # and process probes are platform-specific code, and platform code that
        # is never executed on its own platform is not tested at all.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          # Pinned rather than taken from go.mod: the standard library advisory
          # GO-2026-4602 is fixed in 1.25.8, and an older toolchain must not be
          # selected silently.
          go-version: "1.25.x"
          check-latest: true
          # The module has no dependencies, so there is no go.sum to key a
          # dependency cache on: the cache step could only fail, and did.
          cache: false

      - name: Toolchain
        run: go version

      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        # Compiles every package and its tests for this platform, and reports
        # what the compiler cannot: a format verb that does not match its
        # argument, a lock copied by value, a lost cancel function.
        run: go vet ./...

      - name: Test (race detector)
        # The strict run, on every platform: the concurrency here is real
        # (follow loops, polling, signals, the Windows process group), and the
        # platform-specific half of it only exists on its own platform.
        run: go test -race -count=1 -timeout 600s ./...

      - name: Test (no race detector)
        # A second execution regime, kept on one platform rather than three: the
        # race runtime is slower and schedules differently, so a test that only
        # passes under it is a bug worth knowing about. The other two platforms
        # already ran the same suite above.
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -timeout 600s ./...

  hermetic:
    name: tests do not touch the environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: Workflow file is valid
        # A broken workflow fails silently until somebody notices CI stopped
        # running, so its shape is checked here.
        run: python3 scripts/check-workflow.py

      - name: Run the suite once, in a throwaway HOME, with coverage
        # One execution, three properties: the script asserts that nothing was
        # created outside the tests' own temporary directories, the profile below
        # carries the coverage, and the captured output carries the skips. The
        # profile is written outside the throwaway home on purpose — it is this
        # job's file, not the suite's.
        run: |
          set -euo pipefail
          ./scripts/hermetic-check.sh -v -coverprofile=/tmp/coverage.out 2>&1 | tee /tmp/test-output.txt

      - name: Fail on unexpected skips
        # A skipped test is an untested code path. The list below is the complete
        # set of skips the suite is allowed to have on a runner that does not
        # ship one of the optional tools; every one of them is a test that asks
        # the real tool a question, so there is nothing for it to assert when the
        # tool is absent. Any other skip means the suite silently stopped testing
        # something, and a failure here is the signal to look at why.
        #
        # The pattern matches an indented line too: a skip inside a subtest is
        # just as invisible as a top-level one, and anchoring the match at the
        # start of the line would have let every subtest skip through.
        run: |
          set -euo pipefail
          allowed="$(cat <<'EOF'
          TestInspectReadsARealProcess
          TestNetstatFindsASocketThisProcessHolds
          TestSSNamesTheSocketThisProcessHolds
          TestSSReportsAFreePortAsFree
          TestLsofNamesTheSocketThisProcessHolds
          TestLsofDeclinesAFreePort
          TestLsofDeclinesAnUnusableSelector
          TestDescendsFromUsesTheProcessGroup
          EOF
          )"
          unexpected="$(grep -E '^[[:space:]]*--- SKIP' /tmp/test-output.txt \
            | sed -E 's/^[[:space:]]*--- SKIP: ([^ ]+).*/\1/' \
            | sed -E 's#/.*$##' \
            | sort -u \
            | grep -vxF "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected skips:"
            echo "$unexpected"
            exit 1
          fi
          echo "only the documented optional-tool skips occurred"

      - name: Coverage of the Node resolution
        # The resolution decides which runtime a long-running service uses, and
        # its whole surface is pure logic that every platform exercises: the
        # package is required to be covered statement by statement. The other
        # packages are reported, not gated: their uncovered branches are
        # platform-specific by nature.
        run: |
          python3 scripts/check-coverage.py /tmp/coverage.out \
            --require internal/nodejs=100 \
            --report internal/config \
            --report internal/service

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [test, hermetic]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: Build
        # cgo is off for this step only: the binary is cross-compiled for
        # platforms whose C toolchain is not installed on the runner, and the
        # tool has no cgo dependencies to lose.
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          suffix=""
          [ "${{ matrix.goos }}" = "windows" ] && suffix=".exe"
          version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pkg=github.com/rhczz/dshctl/internal/version
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-s -w -X ${pkg}.Version=${version} -X ${pkg}.Commit=${commit} -X ${pkg}.BuildDate=${date}" \
            -o "dshctl_${{ matrix.goos }}_${{ matrix.goarch }}${suffix}" \
            ./cmd/dshctl

      - name: Smoke test the binary's metadata
        # The binary cannot be executed for another platform, but it can be
        # asked what it was built as. This catches a broken ldflags path.
        # Every string literal in an Actions expression must be quoted: an
        # unquoted word is parsed as a named value, and `amd64` is not one, so
        # the whole workflow file is rejected before any job starts.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          chmod +x dshctl_linux_amd64
          ./dshctl_linux_amd64 version | tee /tmp/version.txt
          grep -q "linux/amd64" /tmp/version.txt
          ./dshctl_linux_amd64 --help > /dev/null
          ./dshctl_linux_amd64 doctor --json > /tmp/doctor.json || true
          python3 -c "import json,sys; json.load(open('/tmp/doctor.json'))"

      - uses: actions/upload-artifact@v4
        with:
          name: dshctl_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dshctl_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 14

  vulncheck:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          check-latest: true
          cache: false

      - name: govulncheck
        # The tool is pinned: `@latest` makes an unchanged commit fail the day a
        # scanner is released, which turns a security gate into noise. Bump the
        # version deliberately. The advisory it guards against — GO-2026-4602 —
        # is fixed in Go 1.25.8, so a failure here means the pinned toolchain is
        # older than the fix.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
